name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded PR runs (saves CI minutes and Supabase Docker spin-ups),
# but never cancel a run on main — the migrate/deploy path must always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: these jobs only read the repo.
permissions:
  contents: read

jobs:
  verify:
    name: lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # npm install (not ci): the lockfile omits some platform-specific optional
      # deps pulled in by next/og, which makes `npm ci` fail cross-platform.
      - run: npm install --no-audit --no-fund
      - run: npx eslint .
      - run: npm test
      - run: npm run build

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      # Boots the full local Supabase stack (custom 544xx ports per config.toml),
      # applying supabase/migrations + seed. Docker is preinstalled on the runner.
      - name: Start local Supabase (migrations + seed)
        run: npx supabase start
      # Guard against schema drift: the committed generated types must match what
      # `supabase gen types` produces from the just-applied migrations. If the diff
      # check fails, run `npm run db:types` locally and commit the result.
      - name: Check generated DB types are in sync
        run: |
          # `supabase gen types` pulls postgres-meta from ECR Public, which
          # anonymous-rate-limits shared CI runners (toomanyrequests). `supabase
          # start` retries internally; this call doesn't, so retry it here.
          ok=false
          for i in 1 2 3; do
            if npm run db:types; then ok=true; break; fi
            echo "db:types attempt $i failed (likely a transient image pull); retrying in 15s…"
            sleep 15
          done
          if [ "$ok" != true ]; then
            echo "::error::supabase gen types failed after 3 attempts (image pull)."; exit 1
          fi
          git diff --ignore-space-at-eol --exit-code src/infrastructure/db/database.types.ts \
            || { echo "::error::database.types.ts is out of date — run 'npm run db:types' and commit."; exit 1; }
      # Export the same env the itests read locally, straight from the running
      # stack (strip quotes; keep only the three vars the tests use).
      - name: Export DB env for the tests
        run: |
          npx supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            --override-name db.url=SUPABASE_DB_URL \
            | grep -E '^SUPABASE_(URL|SERVICE_ROLE_KEY|DB_URL)=' \
            | sed 's/"//g' >> "$GITHUB_ENV"
      # MP-gated specs (mercadopago.itest, booking-routes.itest) skipIf(!MP_ACCESS_TOKEN),
      # so they self-skip here; the DB integration specs run.
      - name: Run integration tests
        run: npm run test:integration
      - name: Stop Supabase
        if: always()
        run: npx supabase stop

  # ── CD: apply pending DB migrations to STAGING (canary, before prod) ─────────
  # Runs ONLY on push to main, after verify + integration. Non-prod, so it is
  # NOT gated by a required reviewer — but it IS scoped to the `staging` GitHub
  # Environment, which holds staging-specific secrets (same NAMES as the
  # `production` Environment, different VALUES):
  #   SUPABASE_ACCESS_TOKEN  — personal access token (account-level; works for both)
  #   SUPABASE_DB_PASSWORD   — STAGING database password
  #   SUPABASE_PROJECT_ID    — STAGING project ref
  # The prod `migrate` job `needs` this one, so a bad migration is caught on the
  # staging DB before prod is even offered for approval. See DEPLOY.md.
  # NOTE: this job requires the `staging` Environment + secrets + a staging
  # Supabase project to exist. Until owner setup is done it will fail and block
  # the prod migrate — do not merge before then.
  migrate-staging:
    name: migrate staging db
    runs-on: ubuntu-latest
    needs: [verify, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: staging-migrate
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Link staging project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      - name: Plan (dry run)
        run: npx supabase db push --linked --dry-run
      - name: Apply pending migrations to staging
        run: npx supabase db push --linked --yes
      - name: Verify staging ledger matches repo
        run: npx supabase migration list --linked

  # ── CD: apply pending DB migrations to production ────────────────────────────
  # Runs ONLY on push to main (post-merge) and ONLY after verify + integration +
  # the staging canary pass. Gated behind the `production` GitHub Environment
  # (repo Settings → Environments): add a required reviewer so this pauses for a
  # one-click approval before it writes to the prod database. Define these as
  # Environment secrets (scoped to `production`, not repo-wide):
  #   SUPABASE_ACCESS_TOKEN  — personal access token (dashboard → account/tokens)
  #   SUPABASE_DB_PASSWORD   — production database password
  #   SUPABASE_PROJECT_ID    — production project ref
  # Migrations MUST be backward-compatible (expand/contract) so the currently
  # live code keeps working the instant they apply. See DEPLOY.md.
  migrate:
    name: migrate prod db
    runs-on: ubuntu-latest
    needs: [verify, integration, migrate-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    environment: production
    concurrency:
      group: prod-migrate
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Link production project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      # Log the exact set of migrations that would apply — visible in the run
      # before the real push writes anything.
      - name: Plan (dry run)
        run: npx supabase db push --linked --dry-run
      - name: Apply pending migrations to prod
        run: npx supabase db push --linked --yes
      # Parity log: confirm the remote ledger now matches the repo's migrations
      # (Local vs Remote columns) — recommended by the Supabase "Managing
      # Environments" guide after a db push.
      - name: Verify prod ledger matches repo
        run: npx supabase migration list --linked
