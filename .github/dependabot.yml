version: 2
updates:
  # App dependencies. Minor/patch bumps are grouped into one PR to cut noise;
  # majors come as individual PRs so breaking changes get reviewed on their own.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    ignore:
      # Framework/toolchain majors are breaking upgrades done deliberately (Next
      # codemod, TS ecosystem support), not weekly bumps — minor/patch still flow.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Keep @types/node aligned to the Node 24 runtime; its majors track Node upgrades.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # eslint majors must move in lockstep with eslint-config-next: its bundled
      # eslint-plugin-react still calls context.getFilename(), removed in eslint 10
      # (PR #85) — the lint step crashes before running. Take it deliberately when
      # the Next preset ships an eslint-10-compatible release, not as a weekly bump.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  # Keeps the SHA-pinned GitHub Actions fresh (updates the pin + its # vN comment).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
